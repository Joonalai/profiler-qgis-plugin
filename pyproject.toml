[project]
name = "profiler-qgis-plugin-root"
version = "0.0.1"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]


[tool.uv.workspace]
members = ["components/*"]

[tool.uv]
package = false
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  # Debugging
  "debugpy>=1.8.22",
  # Testing
  "exceptiongroup",
  "pytest>=9.1.1",
  "pytest-cov",
  "pytest-dotenv>=0.5.2",
  "pytest-lazy-fixtures>=1.1.2",
  "pytest-qt",
  "pytest-qgis",
  "pytest-mock",
  "pytest-subtests",
  "pytest-timeout",
  # Tools
  "qgis-plugin-dev-tools>=0.13.2",
  "copier",
]
docs = [
  "sphinx>=7.0,<9.0",
  "sphinx-rtd-theme>=2.0,<3.0",
  "sphinx-copybutton>=0.5",
  "myst-parser>=3.0,<5.0",
]
lint = [
  # Linting and formatting (ensure precommit yaml has same versions)
  "prek>=0.5.3",
  "ruff==0.16.8",
  "ty==0.0.84",
  "flake8==7.4.1",
  "bandit==1.9.4",
  # flake8 plugins
  "flake8-qgis==2.1.0",
  "flake8-pyproject==1.2.4",
  "flake8-spellcheck==0.28.0",
  # Stubs for type checks
  "PyQt5-stubs==5.15.6.0",
  "PyQt6-stubs==20250824",
]


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[tool.ruff]
target-version = "py312"
line-length = 88

lint.ignore = [
  "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
  "D203",   # Conflicts with D211 (no-blank-line-before-class)
  "D213",   # Conflicts with D212 (multi-line-summary-first-line)
  "G002",   # Logging statement uses %
  "PGH003", # Use specific rule codes when ignoring type issues
  "FIX",    # flake8-fixme
  "TD002",  # Missing author in TODO
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D107",   # Missing docstring in `__init__`
  # Conflicting rules (formatter)
  "D203",   # one-blank-line-before-class, D211 used (no-blank-line-before-class)
  "D213",   # multi-line-summary-second-line, D212 used (multi-line-summary-first-line)
  "COM812", # missing-trailing-comma (formatter will enforce this)
  "ISC001", # single-line-implicit-string-concatenation
  "UP037",  # quoted-annotation (quoted annotations are used with TYPE_CHECKING imports)
]

# List of all rules https://docs.astral.sh/ruff/rules/
lint.select = ["ALL"]

lint.unfixable = [
  "F401", # Unused imports
  "F841", # Unused variables
]

# Avoid flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
lint.external = ["SC200", "QGS"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["profiler_plugin"]

[tool.ruff.lint.per-file-ignores]
"docs/*" = ["ALL"]
"*/profiler_test_utils/*" = ["D"]
"**/{test,test_integration,test_e2e}/**" = [
  "INP001",
  "D",       # pydocstyle
  "DTZ",     # flake8-datetimez
  "FBT",     # flake8-boolean-trap
  "TD",      # flake8-todos
  "S",       # flake8-bandit
  "SLF",     # flake8-self
  "ANN201",  # Missing return type annotation for public function
  "E501",    # Line too long
  "C901",    # Function is too complex
  "PLR2004", # Magic value used in comparison, consider replacing `2000` with a constant variable
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "ARG001",  # Unused function argument
  "ARG005",  # Unused lambda argument
  "ANN202",  # Missing return type annotation for private function
  "PLR0917", # Too many positional arguments (fixtures injected into tests)
]

[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
select = ["SC", "QGS"]
extend-ignore = ["QGS202"]
per-file-ignores = [
  "*/test/*:INP001,SC200,QGS105",
  "docs/*:SC200",
  "components/core/src/profiler_test_utils/*:INP001,SC200,QGS105",
]

[tool.bandit]
exclude_dirs = [
  "components/core/test",
  "components/core/src/profiler_test_utils",
  "components/plugin/test",
  "docs",
]

[tool.ty.src]
exclude = ["docs"]

[tool.ty.environment]
python-version = "3.12"
root = ["components/core/src", "components/plugin/src"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"
division-by-zero = "ignore"

[tool.pytest.ini_options]
testpaths = ["components/core/test", "components/plugin/test"]
addopts = "--import-mode=importlib"
timeout = 1000
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-10s (%(filename)s) %(message)s"
log_cli_date_format = "%H:%M:%S"
qt_log_level_fail = "CRITICAL"
qgis_gui_enabled = true

[tool.coverage.paths]
source = ["src", "**/site-packages"]

[tool.coverage.run]
branch = true
source_pkgs = ["profiler_plugin", "qgis_profiler"]
omit = []

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
