# Inspired by https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi

name: Release & publish
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  style:
    uses: ./.github/workflows/code-style.yml

  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [ style, test ]
    name: Publish plugin to QGIS plugin repository
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:3.44-noble
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"

      - name: Build python packages
        run: uv build --all-packages

      - name: Publish python packages to PyPI
        run: uv publish

      - name: Build QGIS Plugin
        run: |
          cd components/plugin
          rm -rf dist
          uv sync --all-packages --no-editable --locked
          uv run --no-editable qgis-plugin-dev-tools build

      - name: Scan the plugin build
        run: |
          mkdir -p build_scan
          python3 -m zipfile -e components/plugin/dist/*.zip build_scan/
          # Scan for high severity only (-lll), matching qgis policy
          # https://plugins.qgis.org/docs/security-scanning/tools
          uv run bandit -r build_scan/ -lll

      - name: Smoke test the plugin build
        run: |
          PYTHONPATH=build_scan python3 -c \
            "from profiler_plugin.plugin import ProfilerPlugin"

      - name: Publish QGIS Plugin
        run: |
          uv run --no-editable qgis-plugin-dev-tools publish dist/*.zip
        env:
          # Make sure these are set in your repository secrets
          QPDT_PUBLISH_USERNAME: ${{ secrets.QGIS_REPO_USERNAME }}
          QPDT_PUBLISH_PASSWORD: ${{ secrets.QGIS_REPO_PASSWORD }}

      - name: Collect all release assets
        run: cp components/plugin/dist/*.zip dist/

      - name: Upload plugin zip to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2.11.5
        with:
          file: dist/*
          file_glob: true
