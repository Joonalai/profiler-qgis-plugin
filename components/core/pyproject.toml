[project]
name = "profiler-qgis-core"
version = "1.0.0.post0"
description = "A library for profiling QGIS and QGIS plugins."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["qgis_plugin_tools>=2.1.2"]

[project.urls]
homepage = "https://profiler-qgis-plugin.readthedocs.io"
repository = "https://github.com/Joonalai/profiler-qgis-plugin"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.build-backend]
module-name = "qgis_profiler"
